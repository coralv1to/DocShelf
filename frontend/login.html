<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập · DocShelf</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M10 8h9l5 5v11a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <main class="login">
      <div class="login-box">
        <div class="login-brand">
          <div class="brand-logo"><span class="icon" data-icon="shelf"></span></div>
          <h1>DocShelf</h1>
          <p class="muted small">Kệ tài liệu hỏi đáp bằng AI, có trích dẫn nguồn</p>
        </div>

        <form class="login-form" id="login-form">
          <div>
            <label for="username">Tên đăng nhập</label>
            <input class="field" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
          </div>
          <div>
            <label for="password">Mật khẩu</label>
            <input class="field" id="password" type="password" autocomplete="current-password" required />
          </div>
          <p class="login-error" id="login-error" role="alert" hidden></p>
          <button type="submit" class="btn-primary" id="login-btn" disabled>Đăng nhập</button>
        </form>

        <p class="login-foot">Chưa có tài khoản? Liên hệ quản trị viên để được cấp.</p>
      </div>
    </main>

    <script src="assets/common.js"></script>
    <script src="assets/login.js"></script>
  </body>
</html>
